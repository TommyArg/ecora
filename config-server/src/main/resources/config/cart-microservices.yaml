spring:
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    com.tommy.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HM:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HM:mm:ss} - %msg%n'
  file:
    name: logs/cart-microservices.log
    max-size: 10MB
    max-history: 30

server:
  port: 8093