server:
  port: 8092
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      default-zone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    com.tommy.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HM:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HM:mm:ss} - %msg%n'
  file:
    name: logs/product-service.log
    max-size: 10MB
    max-history: 30