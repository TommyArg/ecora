server:
  port: 8091
spring:
  mongodb:
    uri: ${SPRING_MONGODB_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}


logging:
  level:
    root: INFO
    com.tommy.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HM:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HM:mm:ss} - %msg%n'
  file:
    name: logs/customer-service.log
    max-size: 10MB
    max-history: 30


